name: liveops-agent
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * *"      # every day 08:15 IST: a new simulated world, agent re-evaluated
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (guardrails, simulator, stats)
        run: pytest -q
      - name: Evaluate policies and publish
        if: github.event_name != 'push'
        env:
          DAILY: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: python run_eval.py
      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "liveops-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ results.json
          git commit -m "Daily LiveOps eval $(date -u +%F)" || echo "nothing to commit"
          git push
